# Prose linting with Red Hat's Vale style (https://github.com/redhat-documentation/vale-at-red-hat).
#
#   vale sync                                   # once: downloads the RedHat style into .vale/styles
#   vale --minAlertLevel=error *.md             # before a push: must report 0 errors
#
# Rules set to error are ones this guide is clean against, so they cannot regress. Everything
# else is reported at the level the Red Hat style gives it and does not block.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = RedHat
Vocab = AgentIdentity

[*.md]
BasedOnStyles = RedHat
# Fenced code blocks are commands, not prose (Vale would otherwise read their comments).
BlockIgnores = (?s) *(```.*?```)

# --- enforced: clean today, so a regression fails ---------------------------------------------
RedHat.TermsErrors = error
RedHat.Contractions = error
RedHat.Conjunctions = error
RedHat.RepeatedWords = error
RedHat.ReleaseNotes = error
RedHat.ProductCentricWriting = error
RedHat.Hyphens = error
RedHat.Using = error
